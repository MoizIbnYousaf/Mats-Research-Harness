name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv study/.venv && study/.venv/bin/pip install -e 'study[dev,figures]'
      - run: sh scripts/build-runtime.sh --check
      - run: make accept

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo build --release
        working-directory: runtime
      - run: cargo test
        working-directory: runtime
